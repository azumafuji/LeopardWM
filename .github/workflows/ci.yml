name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-pc-windows-msvc
      - run: cargo build --release
      - name: Verify GUI executable subsystems
        shell: pwsh
        run: ./.github/verify-gui-subsystems.ps1
      - name: Verify executable versions
        shell: pwsh
        run: ./.github/verify-executable-versions.ps1
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: leopardwm-arm64-windows
          path: |
            target/aarch64-pc-windows-msvc/release/leopardwm.exe
            target/aarch64-pc-windows-msvc/release/leopardwm-cli.exe
            target/aarch64-pc-windows-msvc/release/lwm.exe
            target/aarch64-pc-windows-msvc/release/leopardwm-watchdog.exe
      # GitHub-hosted Windows runners are x64; run tests and clippy natively.
      - name: Run tests
        shell: pwsh
        run: |
          cargo test --all --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath test-output.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            $lines = Get-Content test-output.log
            $failIdx = [array]::FindLastIndex($lines, [Predicate[string]]{ param($x) $x -match 'failures:' })
            if ($failIdx -ge 0) {
              $start = [Math]::Max(0, $failIdx - 20)
              $end = [Math]::Min($lines.Count - 1, $failIdx + 60)
              $snippet = $lines[$start..$end] -join "`n"
            } else {
              $snippet = $lines[([Math]::Max(0, $lines.Count - 50))..($lines.Count - 1)] -join "`n"
            }
            "# Test Failures`n````n$snippet`n```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit $exitCode
          }
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log
      - name: Verify offline desktop acceptance helpers
        run: python -m unittest discover -s tools -p test_desktop_acceptance.py -v
      - run: cargo clippy --all --target x86_64-pc-windows-msvc -- -D warnings
